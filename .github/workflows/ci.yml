name: CI

on:
  push:
    branches:
      - master
      - "research/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: ST-C3 ultra-fast pipeline dry run
        run: python -m validation.st_c3.run_ultra_fast_pipeline --sample --out-dir reports/validation/st_c3/replay_ci
