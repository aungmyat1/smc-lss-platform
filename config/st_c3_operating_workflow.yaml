strategy: ST-C3
spec: specs/st-c3_v1.0.7.yaml
report_path: reports/operations/st_c3_daily_workflow.json
focus_gate: S1-G5

gates:
  S1-G5:
    stage: A2
    title: Signal and Trade-Plan Conformance
    status: in_progress
    blocked_by: []
    required_paths:
      - strategy/st-c3/rejections.yaml
      - golden/st_c3/negative
      - golden/st_c3/negative/htf_bias
      - golden/st_c3/negative/ote
      - golden/st_c3/negative/session
      - golden/st_c3/negative/risk
      - tests/funnel
      - validation/st_c3/trade_plan.py
      - tests/st_c3/test_s1_g5_signal_trade_plan_conformance.py
    commands:
      - python -m pytest -q tests/st_c3/test_s1_g5_signal_trade_plan_conformance.py
      - python -m pytest -q tests/funnel/test_st_c3_negative_cases.py
      - python -c "from validation.st_c3.negative_runner import run_negative_suite; import json; print(json.dumps(run_negative_suite(), indent=2))"
      - python tools/st_c3_workflow.py
    tasks:
      - id: finalize_trade_plan_object
        title: Finalize Trade-Plan Object
        summary: Keep the S13 trade-plan contract deterministic, pure, stateless, and reproducible.
        artifacts:
          - validation/st_c3/trade_plan.py
          - docs/strategy/st_c3/ST-C3_TRADE_PLAN_SCHEMA.md
          - tests/st_c3/test_s1_g5_signal_trade_plan_conformance.py
        checklist:
          - direction
          - entry
          - stop
          - target
          - expiry
          - source-event IDs
          - evidence bundle
          - rejection codes
          - confidence flags
          - precision rules
      - id: close_rejection_codes
        title: Close Rejection Codes R1-R8
        summary: Maintain one machine-readable registry of deterministic rejection semantics.
        artifacts:
          - strategy/st-c3/rejections.yaml
          - validation/st_c3/rejection_codes.py
          - tests/st_c3/test_negative_cases.py
          - golden/st_c3/negative
      - id: maintain_funnel_tests
        title: Keep Deterministic Funnel Tests Green
        summary: Validate positive, negative, malformed, precision-drift, timestamp-drift, and multi-symbol invariants before advancing.
        artifacts:
          - tests/funnel
          - tests/st_c3/test_golden_cases.py
          - tests/st_c3/test_negative_cases.py
          - tests/st_c3/test_s1_g5_signal_trade_plan_conformance.py

  S1-G6:
    stage: A2
    title: Golden-Case Qualification
    status: blocked
    blocked_by:
      - S1-G5
    required_paths:
      - golden/st_c3
      - golden/st_c3/bos
      - golden/st_c3/choch
      - golden/st_c3/fvg
      - golden/st_c3/liquidity
      - golden/st_c3/displacement
      - golden/st_c3/invalidations
      - tests/funnel
    commands:
      - python -m pytest -q tests/funnel/test_st_c3_golden_bos.py tests/funnel/test_st_c3_golden_choch.py tests/funnel/test_st_c3_golden_fvg.py tests/funnel/test_st_c3_golden_liquidity.py
      - python -c "from validation.st_c3.golden_runner import run_golden_suite; import json; print(json.dumps(run_golden_suite(), indent=2))"
    tasks:
      - id: curate_golden_library
        title: Build the Golden-Case Library
        summary: Curate deterministic examples with evidence JSON, expected state transitions, and expected trade-plan outputs.
        artifacts:
          - golden/st_c3/README.md
          - golden/st_c3/bos
          - golden/st_c3/choch
          - golden/st_c3/fvg
          - golden/st_c3/liquidity
          - golden/st_c3/displacement
          - golden/st_c3/invalidations
      - id: expand_funnel_qualification
        title: Expand Funnel Qualification Tests
        summary: Cover duplicate, boundary, sequencing, malformed-data, precision-drift, timestamp-drift, and multi-symbol consistency scenarios.
        artifacts:
          - tests/funnel

  S1-G7:
    stage: A3
    title: Historical Baseline
    status: blocked
    blocked_by:
      - S1-G6
    required_paths:
      - validation/baseline
    commands:
      - python validation/run_st_c3_a3_replay.py
    tasks:
      - id: multi_year_replay
        title: Run Multi-Year Replay
        summary: Replay 2018-2024 on GBPUSD, XAUUSD, and EURUSD only after A2 passes and A3 is authorized.
        artifacts:
          - validation/baseline

  S1-G8:
    stage: A3
    title: Cost-Adjusted Validation
    status: blocked
    blocked_by:
      - S1-G7
    required_paths:
      - validation/cost-adjusted
    commands:
      - python validation/run_v310_net_of_cost.py
    tasks:
      - id: cost_adjusted_validation
        title: Apply Realistic Costs
        summary: Include spread, slippage, commissions, latency, and partial fills in validation outputs.
        artifacts:
          - validation/cost-adjusted

  S1-G9:
    stage: A3
    title: Walk-Forward and Out-of-Sample Validation
    status: blocked
    blocked_by:
      - S1-G8
    required_paths:
      - validation/walk-forward
    commands:
      - python -m pytest -q tests/test_statistical_validation.py
    tasks:
      - id: walk_forward_validation
        title: Run Train/Validate/OOS Splits
        summary: Demonstrate expectancy greater than zero, PF above 1.3, drawdown below 15 percent, and regime stability.
        artifacts:
          - validation/walk-forward

  S1-G10:
    stage: A3
    title: Robustness Qualification
    status: blocked
    blocked_by:
      - S1-G9
    required_paths:
      - validation/robustness
    commands:
      - python -m pytest -q tests/test_power_planning.py
    tasks:
      - id: monte_carlo_robustness
        title: Run Monte Carlo Robustness
        summary: Stress the trade distribution with randomized order, slippage, spread, and volatility regimes.
        artifacts:
          - validation/robustness
      - id: failure_analysis_loop
        title: Operate the Failure Analysis Loop
        summary: Every failure should produce a hypothesis, a candidate fix, a spec revision, and new conformance tests.
        artifacts:
          - experiments/hypotheses.yaml

  S2-G1:
    stage: B
    title: Execution Development
    status: blocked
    blocked_by:
      - S1-G10
    required_paths:
      - demo
    commands: []
    tasks:
      - id: execution_layer_only
        title: Build the Execution Layer
        summary: Order manager, position manager, risk manager, broker adapter, kill switch, journal, and reconciliation engine with zero strategy logic.
        artifacts:
          - src/trade_manager.py
          - docs/strategy/st_c3/ST-C3_EXECUTION_AGENT_SPEC.md

  S2-G2:
    stage: B
    title: Demo Validation
    status: blocked
    blocked_by:
      - S2-G1
    required_paths:
      - demo
    commands: []
    tasks:
      - id: demo_qualification
        title: Demo Qualification
        summary: Collect latency, slippage, execution-accuracy, risk-compliance, and journal-completeness evidence over 30-90 days.
        artifacts:
          - demo

  S2-G3:
    stage: B
    title: Production Promotion
    status: blocked
    blocked_by:
      - S2-G2
    required_paths:
      - production
    commands: []
    tasks:
      - id: production_freeze
        title: Freeze and Promote the Strategy Package
        summary: Promote only after the production thresholds and owner approval are all satisfied.
        artifacts:
          - production
