    current_gate_name: Reference Implementation Authorization
    authorization: scoped_reference_implementation_granted
    opened:
      decision: owner_directive
      timestamp: "2026-07-26"
      authorized_scope:
        - reference_funnel_assembly   # building the ST-C3 detection pipeline itself
        - golden_case_tests           # Phase 3 of the validation lifecycle
        - negative_case_tests         # Phase 4
        - existence_check_conformance_run   # resolves R-18 once the funnel exists
        - research_and_validation_tasks
      explicitly_not_authorized:
        - execution
        - optimization
        - a3_statistical_validation_opening
        - demo_trading
        - live_trading
        - production_promotion
      spec_resolution_status: "24/26 of the original tracked fields decided (see v1_0_2/v1_0_3/v1_0_4_revision blocks above), 1 revised (R-02), 4 ruled out of v1.x scope. R-27 through R-30 DECIDED (v1_0_5_revision). R-31 through R-33 DECIDED with clean provenance (v1_0_7_revision, reconfirming values first proposed by the now-quarantined v1_0_6_revision). R-18 CLOSED 2026-07-27 at signal_rate=0.0 via the v1.x funnel-freeze decision (governance labeling only, no spec/code change) -- see reference_funnel.existence_check_r18 below and a2_signal_conformance.s1_g2_gate above. Every field on the R-01-R-33 tracker is now resolved. This does not itself pass the full a2_signal_conformance substage (S1-G3-S1-G6 remain not started) or authorize A3/execution/demo/live."
