    resolution_matrix: reports/validation/st_c3/RESOLUTION_MATRIX.md
    reference_funnel:
      status: kernel_built_price_detection_not_started
      report: reports/validation/st_c3/S1-G2_REFERENCE_FUNNEL_REPORT.md
      built: [validation/st_c3/evidence.py, validation/st_c3/rejection_codes.py,
        validation/st_c3/kernel.py, validation/st_c3/trade_plan.py,
        validation/run_st_c3_existence_readiness.py]
      tests: "tests/st_c3/ (20 passed: golden-case, negative-case, existence-check readiness)"
      scope_note: >
        Implements the deterministic evidence-to-trade-plan validator kernel
        (state_machine.transitions / evidence_bindings / trade_plan.schema),
        which v1.0.1 fully specifies. Does NOT implement real price-bar SMC
        detection (sweep/displacement/freshness/etc.) because those
        thresholds remain UNRESOLVED/PROVISIONAL in the frozen spec even
        though OWNER_DECISION_LOG.md records owner decisions for most of
        them (R-04..R-26) -- those decisions are not yet folded into a
        frozen spec revision, so using them would implement un-frozen
        values. A v1.0.2+ spec cut is required before price-level detection
        modules can be built.
      existence_check_r18:
        status: resolved   # real detection-module code written and run against real candle data
        reason: >
          RESOLVED 2026-07-26. validation/st_c3/evidence_builder.py
          implements build_evidence_bundle() per
          R18_EVIDENCE_BUILDER_DESIGN.md's Tier 1 (direct smc_engine
          primitive reuse) and Tier 2 (new glue logic, e.g. BOSExtreme
          pullback tracking, LTF confirmation, target/RR computation),
          using every v1.0.6-frozen parameter (R-04..R-33). Wired into
          tools/existence_check.py's unmodified SignalFn contract via
          validation/run_st_c3_existence_check.py. Run against real GBPUSD
          H4/M15/M3 data (EURUSD excluded -- insufficient history, see
          R27_R30_RESEARCH_REPORT.md). Result: signal_rate = 0.0 over the
          3,339-bar H4/M15/M3 overlap window (2026-06-05 to 2026-07-24,
          bounded by GBPUSD_M3.csv's start date). See
          reports/validation/st_c3/R18_EXISTENCE_CHECK_RESULTS.md for the
          full rejection-code breakdown and documented implementation
          caveats. This result does not itself approve, reject, or
          invalidate ST-C3 -- it satisfies R-18's mechanical requirement (a
          real number in place of UNRESOLVED), nothing more. Does not
          authorize A3, execution, optimization, demo, or live.
        blocked_by: []
        gap_report: reports/validation/st_c3/R18_DETECTION_GAP_REPORT.md
        research_plan: reports/validation/st_c3/R18_R27_R30_RESEARCH_PLAN.md
        research_report: reports/validation/st_c3/R27_R30_RESEARCH_REPORT.md
        design_doc: reports/validation/st_c3/R18_EVIDENCE_BUILDER_DESIGN.md
        results: reports/validation/st_c3/R18_EXISTENCE_CHECK_RESULTS.md
        builder_module: validation/st_c3/evidence_builder.py
        runner_script: validation/run_st_c3_existence_check.py
        decision_status: >
          All of R-27/R-28/R-29/R-30 (v1_0_5_revision) and R-31/R-32/R-33
          (v1_0_6_revision) decided. R-18 itself is now RESOLVED -- see
          `reason` above. Every field on the R-01-R-33 tracker is resolved.

