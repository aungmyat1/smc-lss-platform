      explicitly_not_authorized: [broker_integration, demo_trading, live_trading, production_promotion, stage_b_execution]
    replay_engine:
      status: built_run_and_lifecycle_tested
      builder_module: validation/st_c3/a3_replay_engine.py
      runner_script: validation/run_st_c3_a3_replay.py
      results: reports/validation/st_c3/A3_REPLAY_RESULTS.md
      raw_output: reports/a3/ST-C3_v1.0.6_GBPUSD_M15_a3_replay.json
      run_date: "2026-07-27"
      summary: >
        Run against real GBPUSD H4/M15/M3 data (same 3,339-bar window as
        R-18): 0 TradePlans emitted, rejection-code breakdown identical to
        R-18. Confirms the replay engine's signal-detection path is
        correct. No RR distribution, win rate, or session-behavior data
        exists yet on real data. Further progress on real-data metrics
        requires more historical data, not more code.
      synthetic_lifecycle_tests:
        status: done
        test_file: tests/st_c3/test_a3_lifecycle.py
        test_count: 5
        results: reports/validation/st_c3/A3_SYNTHETIC_LIFECYCLE_RESULTS.md
        run_date: "2026-07-27"
        summary: >
          `_simulate_lifecycle` tested directly against hand-built
          TradePlan fixtures and scripted price paths (TP1-only partial
          close, full TP1/TP2/TP3 closure, immediate SL, partial-TP1-then-SL,
          BIAS_FLIP via a synthetic H4 swing zigzag). All 5 pass; full repo
          suite remains green. Synthetic/code-level coverage only -- does
          not substitute for real-data validation.
    blocked_by: []   # A3 itself is open; producing a statistical qualification verdict is blocked on data volume, tracked in replay_engine.summary above, not on authorization

