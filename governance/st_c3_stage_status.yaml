  a1_logic_conformance:
    status: passed
    gate: S1-G1C
    report: reports/validation/st_c3/ST-C3_S1-G1C_LOGIC_CONFORMANCE_REPORT.md
    checklist: reports/validation/st_c3/st-c3_s1-g1c_checklist.md
    governance_review: reports/validation/st_c3/GOVERNANCE_REVIEW_REPORT.md
    patch_recommendation: reports/validation/st_c3/ST-C3_v1.0.1_PATCH_RECOMMENDATION.md
    rerun_report: reports/validation/st_c3/S1-G1C_RERUN_REPORT.md
    rcr_entry: "reports/research_log.md, 'ST-C3 rejection-code layer fix' entry, 2026-07-25"
    closed_findings:
      - id: R-1
        severity: significant
        summary: S12_RISK_SLTP mis-coded as R5_NO_FVG_OB_CONFLUENCE
        resolution: added dedicated R8_INVALID_RISK_OR_TARGET code, repointed S12
      - id: R-2
        severity: internal_inconsistency
        summary: transitions.S12.failure_code placeholder disagreed with evidence_bindings/validator_rules
        resolution: replaced placeholder with R8_INVALID_RISK_OR_TARGET in all three representations
      - id: R-3
        severity: minor
        summary: S5/S6 rejection-code reuse not justified by target code's trigger list
        resolution: extended R3/R4 trigger lists to explicitly cover S5/S6 reuse
      - id: G-4
        severity: preparation_gap
        summary: no governance/st_c3_stage_status.yaml existed prior to this file
        resolution: closed_by_this_file
      - id: GR-1
        severity: minor
        summary: ST-C3_STATE_MACHINE.md omitted from original patch recommendation's migration file list
        resolution: added to migration scope and updated alongside the other three companion docs
    next_required_decision: null   # satisfied 2026-07-26, see a2_signal_conformance below

  a2_signal_conformance:
    status: passed
    closure_decision:
      decision: owner_directive
      timestamp: "2026-07-26"
      decided_by: Owner (Aung)
      decision_log: reports/validation/st_c3/OWNER_DECISION_LOG.md, "A2/S1-G2 gate closure" entry
      summary: >
        A2/S1-G2 declared PASSED. All required conformance work complete:
        spec v1.0.6 frozen (R-31/R-32/R-33 resolved), reference funnel
        (all 15 evidence types) fully implemented and conformant, R-18
        existence-check floor computed and published. Every field on the
        R-01-R-33 tracker resolved. Does not authorize A3, execution,
        optimization, demo, or live -- each remains a separate future
        owner decision.
    current_gate: S1-G2
    current_gate_name: Reference Implementation Authorization
    authorization: scoped_reference_implementation_granted
    opened:
      decision: owner_directive
      timestamp: "2026-07-26"
      authorized_scope:
        - reference_funnel_assembly   # building the ST-C3 detection pipeline itself
        - golden_case_tests           # Phase 3 of the validation lifecycle
        - negative_case_tests         # Phase 4
        - existence_check_conformance_run   # resolves R-18 once the funnel exists
        - research_and_validation_tasks
      explicitly_not_authorized:
        - execution
        - optimization
        - a3_statistical_validation_opening
        - demo_trading
        - live_trading
        - production_promotion
      spec_resolution_status: "24/26 of the original tracked fields decided (see v1_0_2/v1_0_3/v1_0_4_revision blocks above), 1 revised (R-02), 4 ruled out of v1.x scope. R-27 through R-30 (the structural-detection-algorithm gap found while attempting real R-18 work) are DECIDED as of v1_0_5_revision. R-31 through R-33 (the evidence-builder Tier 3 numeric-placeholder gap found while scoping build_evidence_bundle()) are DECIDED as of v1_0_6_revision. R-18 itself is now RESOLVED (signal_rate=0.0, real GBPUSD data) as of 2026-07-26 -- see reference_funnel.existence_check_r18 below. Every field on the entire R-01-R-33 tracker is resolved. This closes the R-18 research item only; it does not itself close the broader A2/S1-G2 gate or authorize A3/execution/demo/live."
