      modeled_on: reports/validation/st_c2/S1_G2_REFERENCE_IMPLEMENTATION_COMPLETION_AUDIT.md
      recommendation: remain_open   # the audit's own recommendation, at the time it was written -- superseded by the owner's freeze decision below, which is a distinct, later, explicit choice between the audit's own two identified paths
