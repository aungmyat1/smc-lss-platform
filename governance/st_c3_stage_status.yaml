        Implements the deterministic evidence-to-trade-plan validator
        kernel (state_machine.transitions / evidence_bindings /
        trade_plan.schema), plus real price-level detection
        (validation/st_c3/detection.py) for 9 of 12 gating stages (S1 HTF
        bias, S2 raw sweep, S3 sweep reclaim, S4 displacement+BOS, S5 BOS
        extreme lock, S6 dealing range, S8 FVG/OB, S10 session gatekeeper,
        S11 entry-window check mechanism), against real GBPUSD H4/M15
        data, using every filter/algorithm parameter frozen through
        specs/st-c3_v1.0.7.yaml (R-31/32/33 folded in 2026-07-27). Three
        stages (S7 OTE, S9 LTF confirmation, S12 risk/SL/TP) have no real
        detection code -- each blocked on a field with no owner decision
