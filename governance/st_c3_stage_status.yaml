        closed_by: [S7_ote_band_permanently_out_of_v1x_scope,
          S9_ltf_choch_params_permanently_out_of_v1x_scope,
          S12_r08_guard_direction_permanently_out_of_v1x_scope]
        freeze_report: reports/validation/st_c3/V1X_FUNNEL_FREEZE_AND_R18_CLOSURE.md
        gap_report: reports/validation/st_c3/R18_DETECTION_GAP_REPORT.md
        research_plan: reports/validation/st_c3/R18_R27_R30_RESEARCH_PLAN.md
        research_report: reports/validation/st_c3/R27_R30_RESEARCH_REPORT.md
        detection_module_report: reports/validation/st_c3/R18_DETECTION_MODULE_REPORT.md
