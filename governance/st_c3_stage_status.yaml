          fabricated stub result, and no literal EvidenceBundle/run_kernel()
          pass was executed (it would be substantively empty, always
          halting at S7). See
          reports/validation/st_c3/V1X_FUNNEL_FREEZE_AND_R18_CLOSURE.md.
          This is unrelated to and does not rely on a separate, earlier
          2026-07-26 claim of the same signal_rate=0.0 value via
