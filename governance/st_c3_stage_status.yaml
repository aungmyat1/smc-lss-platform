  stage_b_only: true   # portfolio-level arbitration; does not affect S0-S13 state machine, no execution code implemented
  no_structural_change: true
  no_new_logic_execution_optimization_or_a3: true

stage_a_strategy_validation:
  status: in_progress

  a1_logic_conformance:
    status: passed
    gate: S1-G1C
    report: reports/validation/st_c3/ST-C3_S1-G1C_LOGIC_CONFORMANCE_REPORT.md
    checklist: reports/validation/st_c3/st-c3_s1-g1c_checklist.md
    governance_review: reports/validation/st_c3/GOVERNANCE_REVIEW_REPORT.md
    patch_recommendation: reports/validation/st_c3/ST-C3_v1.0.1_PATCH_RECOMMENDATION.md
    rerun_report: reports/validation/st_c3/S1-G1C_RERUN_REPORT.md
    rcr_entry: "reports/research_log.md, 'ST-C3 rejection-code layer fix' entry, 2026-07-25"
    closed_findings:
      - id: R-1
        severity: significant
        summary: S12_RISK_SLTP mis-coded as R5_NO_FVG_OB_CONFLUENCE
        resolution: added dedicated R8_INVALID_RISK_OR_TARGET code, repointed S12
      - id: R-2
        severity: internal_inconsistency
        summary: transitions.S12.failure_code placeholder disagreed with evidence_bindings/validator_rules
        resolution: replaced placeholder with R8_INVALID_RISK_OR_TARGET in all three representations
      - id: R-3
        severity: minor
        summary: S5/S6 rejection-code reuse not justified by target code's trigger list
        resolution: extended R3/R4 trigger lists to explicitly cover S5/S6 reuse
      - id: G-4
        severity: preparation_gap
        summary: no governance/st_c3_stage_status.yaml existed prior to this file
        resolution: closed_by_this_file
      - id: GR-1
        severity: minor
        summary: ST-C3_STATE_MACHINE.md omitted from original patch recommendation's migration file list
        resolution: added to migration scope and updated alongside the other three companion docs
    next_required_decision: null   # satisfied 2026-07-26, see a2_signal_conformance below

  a2_signal_conformance:
    status: in_progress
    current_gate: S1-G2
    current_gate_name: Reference Implementation Authorization
    authorization: scoped_reference_implementation_granted
    opened:
      decision: owner_directive
      timestamp: "2026-07-26"
      authorized_scope:
        - reference_funnel_assembly   # building the ST-C3 detection pipeline itself
        - golden_case_tests           # Phase 3 of the validation lifecycle
        - negative_case_tests         # Phase 4
        - existence_check_conformance_run   # resolves R-18 once the funnel exists
        - research_and_validation_tasks
      explicitly_not_authorized:
        - execution
        - optimization
        - a3_statistical_validation_opening
        - demo_trading
        - live_trading
        - production_promotion
      spec_resolution_status: "21/26 decided, 2 deferred (R-21 fixed_lot_size, R-22 selection_logic), 2 pending (R-03 low_liquidity_filters, R-18 existence_check_floor). R-18 unblocks now that the funnel may be assembled; R-03 still needs an explicit low-liquidity-signature definition."
    decision_log: reports/validation/st_c3/OWNER_DECISION_LOG.md
    resolution_matrix: reports/validation/st_c3/RESOLUTION_MATRIX.md
    reference_funnel:
      status: kernel_built_price_detection_not_started
      report: reports/validation/st_c3/S1-G2_REFERENCE_FUNNEL_REPORT.md
      built: [validation/st_c3/evidence.py, validation/st_c3/rejection_codes.py,
        validation/st_c3/kernel.py, validation/st_c3/trade_plan.py,
        validation/run_st_c3_existence_readiness.py]
      tests: tests/st_c3/ (20 passed: golden-case, negative-case, existence-check readiness)
      scope_note: >
        Implements the deterministic evidence-to-trade-plan validator kernel
        (state_machine.transitions / evidence_bindings / trade_plan.schema),
        which v1.0.1 fully specifies. Does NOT implement real price-bar SMC
        detection (sweep/displacement/freshness/etc.) because those
        thresholds remain UNRESOLVED/PROVISIONAL in the frozen spec even
        though OWNER_DECISION_LOG.md records owner decisions for most of
        them (R-04..R-26) -- those decisions are not yet folded into a
        frozen spec revision, so using them would implement un-frozen
        values. A v1.0.2+ spec cut is required before price-level detection
        modules can be built.
      existence_check_r18: >
        Not resolved by this work. run_st_c3_existence_readiness.py proves
        wire-compatibility with tools/existence_check.py using a synthetic
        hand-built evidence set only -- it is not a real R-18 signal-rate
        result. specs/st-c3_v1.0.2.yaml (v1_0_2_revision above) has since
        frozen the detection thresholds this was blocked on, but a real R-18
        run still needs price-level detection modules built against those
        now-frozen numbers -- that implementation work is separate from and
        follows this parameter-freeze revision, not automatic from it.

  a3_statistical_validation:
    status: blocked
    blocked_by:
      - a2_signal_conformance   # not yet passed/closed, only opened; A3 opening itself remains a separate future owner decision per explicitly_not_authorized above

stage_b_execution_qualification:
  status: blocked
  blocked_by:
    - a3_statistical_validation

freeze_state:
  strategy_frozen: true
  engine_implements_spec: false   # still false — authorization to assemble a reference funnel does not itself mean one exists yet
  implementation_authorization: scoped_reference_implementation_granted   # S1-G2 research/validation scope only; see a2_signal_conformance.opened above

forbidden_until_authorized:
  - historical_baseline   # A3/S1-G7 per PROJECT_STATUS.md's path — owner explicitly said "no A3 opening"
  - cost_adjusted_backtest
  - walk_forward
  - broker_integration
  - demo_trading
  - live_trading
  - production_promotion
  # NOTE: "reference_implementation" removed from this list 2026-07-26 —
  # funnel assembly for golden/negative-case tests and existence-check
  # research is now authorized under scoped S1-G2. Everything else here
  # (including historical_baseline, which is A3/S1-G7 work) remains
  # forbidden per a2_signal_conformance.opened.explicitly_not_authorized.
