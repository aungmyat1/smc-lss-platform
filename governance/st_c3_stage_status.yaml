      basis: v1x_funnel_freeze_at_9_stages
      decision_report: reports/validation/st_c3/V1X_FUNNEL_FREEZE_AND_R18_CLOSURE.md
      decision_log: "reports/validation/st_c3/OWNER_DECISION_LOG.md, 'v1.x funnel freeze and R-18 closure' entry"
      summary: >
        Owner chose to freeze the v1.x reference-implementation scope at
        the 9 currently-implemented stages (governance labeling only -- no
        change to specs/st-c3_v1.0.7.yaml's frozen state machine, evidence
        registry, or trade-plan schema; S7/S9/S12 remain specified exactly
