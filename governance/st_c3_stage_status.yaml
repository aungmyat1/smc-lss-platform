    Owner submission labeled this decision "R-22" but actually supplied a
    revision to R-02 (instrument scope), not R-22's own field
    (instrument.selection_logic, cross-instrument tie-breaking). Corrected
    per the same ID-mismatch-detection precedent already applied to other
