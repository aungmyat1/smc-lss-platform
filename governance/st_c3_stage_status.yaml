        - gate_conflation   # conflates S1-G2 (reference-implementation-authorization gate) with the full A2 substage (S1-G3 through S1-G6 per PROJECT_STATUS.md's documented path)
        - depends_on_rejected_r18_resolution   # the "every field resolved" premise relied on evidence_builder.py's non-compliant OTE usage
