# ============================================================
# 6. Risk & Portfolio
# ============================================================
risk:
  per_trade_risk_pct: UNRESOLVED   # PROPOSED (R-11): 0.5%, matches docs/CHARTER.md platform convention and specs/st-c2_v1.2.0.yaml:323
  min_rr: CONFIGURABLE_PROVISIONAL_3R
  max_positions: UNRESOLVED   # PROPOSED (R-12): 3, matches docs/CHARTER.md and specs/st-c2_v1.2.0.yaml:325
  portfolio_heat_pct: UNRESOLVED   # PROPOSED (R-13): 3.0% or 4.0% — owner's choice between two existing platform precedents (ST-C2 uses 3.0%, CHARTER.md states 4%)
  daily_loss_pct: UNRESOLVED   # PROPOSED (R-14): 3.0%, matches docs/CHARTER.md and specs/st-c2_v1.2.0.yaml:327
  weekly_loss_pct: UNRESOLVED   # PROPOSED (R-15): 7.0%, matches specs/st-c2_v1.2.0.yaml:328 (no CHARTER equivalent exists)

conformance:
  require_all_stages_pass: true
  log_level: info

diagnostics:
  enable_audit_logs: true
  record_rejected_setups: true

# ============================================================
# 8. RCR Pre-Registration
# ============================================================
rcr_preregistration:
  research_log_entry: "ST-C3 v1.0.0 candidate intake — Daily Price Action funnel, reports/research_log.md, 2026-07-24"
  revision_rcr_entry: "ST-C3 rejection-code layer fix, reports/research_log.md, 2026-07-25"
  primary_metric: UNRESOLVED   # PROPOSED (R-16): expectancy_r, matches this repo's existing A3 promotion-gate convention
  secondary_metrics: UNRESOLVED   # PROPOSED (R-17): [profit_factor, sharpe_ratio, maximum_drawdown_r], matches validation/performance_metrics.py's existing metric set
  existence_check_floor: UNRESOLVED   # PROPOSED (R-18): compute via tools/power_planning.py once R-02/R-16/R-20 resolved; no number proposed without that data
  population_feasibility_floor: UNRESOLVED   # PROPOSED (R-19): 300 trades, matches this project's stated A3 promotion-gate convention elsewhere
  statistical_claim_floor: UNRESOLVED   # PROPOSED (R-20): PF >= 1.40, expectancy >= 0.20R, Sharpe >= 1.20, matches this project's A3 promotion-gate language used elsewhere

