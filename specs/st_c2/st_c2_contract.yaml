strategy:
  id: ST-C2
  version: 1.2.0
  symbol: GBPUSD
  authority_spec: specs/st-c2_v1.2.0.yaml
  conformance_stage: A2
  execution_authority: none
  completion_policy: A2 closes only when every contract rule has implementation, tests, output shape, failure-code coverage, and validation metric coverage.

funnel_stages:
  - id: S1
    key: market_context
    implementation_stage_names: [htf_bias]
    required_inputs: [H4 candles, ST-C2 spec, GBPUSD symbol metadata, causal cutoff]
    required_outputs: [bias, trend_state, context_confidence, reason, bias_evidence_timestamp]
    deterministic_rules: [STC2-STRUCT-001, STC2-STRUCT-004, STC2-STRUCT-005, STC2-STRUCT-006, STC2-BIAS-001, STC2-BIAS-002, STC2-BIAS-003, STC2-BIAS-004, STC2-BIAS-005]
    failure_codes: [R2, INSUFFICIENT_CHOCH_DISPLACEMENT, NO_CONFIRMED_HTF_BOS_OR_CHOCH]
    validation_metrics: [htf_bias_accuracy, ambiguity_count, structural_event_match_rate]
  - id: S2
    key: session_filter
    implementation_stage_names: [session, config]
    required_inputs: [candidate timestamp, configured London session, configured New York session, causal cutoff]
    required_outputs: [session_valid, session_name, reason]
    deterministic_rules: [STC2-SCOPE-001, STC2-TF-001, STC2-MGMT-001]
    failure_codes: [R6, R7, OUTSIDE_TRADING_SESSION, SESSION_CONFIG_MISSING]
    validation_metrics: [session_acceptance_rate, dst_ambiguity_count, session_rejection_count]
  - id: S3
    key: market_structure_ltf
    implementation_stage_names: [ltf_confirmation]
    required_inputs: [M3 candles, HTF bias evidence, POI/FVG context, causal cutoff]
    required_outputs: [structure_valid, trend_state, reason, confirmation_event_id]
    deterministic_rules: [STC2-STRUCT-002, STC2-STRUCT-003, STC2-LTF-001, STC2-LTF-002, STC2-LTF-003, STC2-LTF-004]
    failure_codes: [R5, INTERNAL_BOS_MISSING, CHOCH_CLOSE_CONFIRMATION_MISSING, MAX_SETUP_BARS_EXCEEDED]
    validation_metrics: [bos_precision, choch_precision, swing_accuracy]
  - id: S4
    key: liquidity
    implementation_stage_names: [liquidity]
    required_inputs: [H4 candles, structural events, direction, current price, causal cutoff]
    required_outputs: [liquidity_event, liquidity_type, sweep_direction, confidence]
    deterministic_rules: [STC2-LIQ-001, STC2-LIQ-002, STC2-LIQ-003, STC2-LIQ-004, STC2-LIQ-005, STC2-LIQ-006, STC2-LIQ-007]
    failure_codes: [R1, NO_ELIGIBLE_LIQUIDITY_POOL, SWEEP_WICK_RATIO_INSUFFICIENT, SWEEP_NOT_RECLAIMED, SWEEP_AGE_EXCEEDED]
    validation_metrics: [sweep_accuracy, false_positive_rate, pool_tiebreak_count]
  - id: S5
    key: poi
    implementation_stage_names: [ote, fvg_alignment]
    required_inputs: [H4 candles, M15 candles, M3 candles, dealing range, liquidity event, causal cutoff]
    required_outputs: [poi_valid, poi_type, distance, strength_score, mitigation_state, fvg_event_ids]
    deterministic_rules: [STC2-POI-001, STC2-OTE-001, STC2-OTE-002, STC2-OTE-003, STC2-FVG-001, STC2-FVG-002, STC2-FVG-003, STC2-FVG-004, STC2-FVG-005, STC2-FVG-006, STC2-FVG-007]
    failure_codes: [R3, R4, OTE_LOCATION_FAILED, FVG_CHAIN_MISSING, FVG_MITIGATED_BEYOND_THRESHOLD]
    validation_metrics: [poi_detection_precision, mitigation_accuracy, fvg_chain_match_rate]
  - id: S6
    key: entry_confirmation
    implementation_stage_names: [ltf_confirmation, signal_candidate]
    required_inputs: [M3 candles, valid POI, LTF confirmation event, causal cutoff]
    required_outputs: [entry_approved, trigger_type, trigger_confidence, confirmation_reason, invalidation_swing, execution_bar_index]
    deterministic_rules: [STC2-ENTRY-001, STC2-ENTRY-002, STC2-ENTRY-003, STC2-DEDUP-001]
    failure_codes: [R5, DUPLICATE_SETUP_REJECTED, ENTRY_WINDOW_EXPIRED, EARLIEST_FILL_BAR_NOT_REACHED]
    validation_metrics: [trigger_success_rate, false_trigger_rate, duplicate_rejection_count]
  - id: S7
    key: risk_validation
    implementation_stage_names: [trade_plan, risk]
    required_inputs: [signal candidate, source events, GBPUSD cost profile, portfolio state, causal cutoff]
    required_outputs: [trade_approved, risk_pct, rr, sl, tp, reason, trade_plan_id]
    deterministic_rules: [STC2-STOP-001, STC2-STOP-002, STC2-TARGET-001, STC2-RISK-001, STC2-REJECT-001]
    failure_codes: [R6, STOP_INVALID, STOP_DISTANCE_OUT_OF_BOUNDS, TARGET_MISSING, NET_R_INSUFFICIENT, COST_PROFILE_MISSING, DUPLICATE_TRADE]
    validation_metrics: [invalid_rr, invalid_sl, duplicate_trade_prevention, cost_adjusted_rr_rejection_count]

